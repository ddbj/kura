name: kura

services:
  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.51
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/kura/entrypoint.sh"]
    command:
      - server
      - -dir=/data
      - -master.port=9333
      # per-user bucket = per-collection volumes: the default -volume.max=8
      # runs out of volume slots as buckets accumulate, so let it auto-scale
      # with free disk instead
      - -volume.max=0
      # master が起動時に弾く上限は 30720 (= 30 GiB、4-byte offset ビルドの
      # VolumeSizeLimitGB)。KURA_VOLUME_SIZE_LIMIT_MB はこれ以下にする。
      - -master.volumeSizeLimitMB=${KURA_VOLUME_SIZE_LIMIT_MB}
      # データのファイルシステムの空きがこれを下回ると、全 volume が read-only に
      # なる。既定は SeaweedFS と同じ 1%。大きな共有ファイルシステムでは 1% でも
      # kura が使う量よりずっと大きいので、容量 (例: 100GiB) で指定する。
      - -volume.minFreeSpace=${KURA_VOLUME_MIN_FREE_SPACE:-1}
      - -volume.port=8082
      - -filer
      - -filer.port=8888
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.iam.config=/etc/seaweedfs/iam.json
      - -s3.allowedOrigins=${KURA_S3_ALLOWED_ORIGINS}
      - -ip.bind=0.0.0.0
    environment:
      KURA_OIDC_ISSUER: ${KURA_OIDC_ISSUER}
      KURA_OIDC_CLIENT_ID: ${KURA_OIDC_CLIENT_ID}
      KURA_OIDC_JWKS_URI: ${KURA_OIDC_JWKS_URI}
      KURA_STS_SIGNING_KEY: ${KURA_STS_SIGNING_KEY}
      KURA_ROOT_ACCESS_KEY: ${KURA_ROOT_ACCESS_KEY}
      KURA_ROOT_SECRET_KEY: ${KURA_ROOT_SECRET_KEY}
      KURA_FILER_JWT_KEY: ${KURA_FILER_JWT_KEY}
      KURA_ADMIN_SUBS: ${KURA_ADMIN_SUBS:-}
      # default-quota reconciler (entrypoint.sh)
      KURA_QUOTA_DEFAULT_MB: ${KURA_QUOTA_DEFAULT_MB:-1048576}
      KURA_OPS_INTERVAL_SECONDS: ${KURA_OPS_INTERVAL_SECONDS:-86400}
    volumes:
      - ./seaweedfs/entrypoint.sh:/kura/entrypoint.sh:ro
      # /data は bind mount で渡す。named / anonymous volume にすると podman が
      # image 内の初期 dir を copy-up する際に chown を発火し、それを拒否する
      # ファイルシステム上では起動できない。filer の
      # LevelDB も -dir 配下の /data/filerldb2 に作られるため、この 1 本で
      # 永続データを覆える。
      - ${KURA_SEAWEEDFS_DATA_DIR:-./data/seaweedfs}:/data
    ports:
      # S3 API のみ公開する。filer (8888) / master (9333) は内部 network に閉じる。
      # bind 先は default で loopback。外から届く必要がある環境だけ
      # KURA_BIND_ADDR で開ける。
      - "${KURA_BIND_ADDR:-127.0.0.1}:${KURA_S3_PORT}:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 2s
      retries: 60

  # web と ops は Dockerfile の runtime stage から作る同じ形の image で動く。
  # image に SPA のビルド結果が入るので、build arg は SPA に埋め込む値だけを
  # 渡す（secret は渡さない）。
  #
  # reference SPA の静的配信。ビルド済みの build/client を vite の preview
  # server が配る。kura の機能には関与しないので SeaweedFS には一切触らない。
  web:
    build: &runtime-build
      context: .
      target: runtime
      args:
        KURA_OIDC_ISSUER: ${KURA_OIDC_ISSUER}
        KURA_OIDC_CLIENT_ID: ${KURA_OIDC_CLIENT_ID}
        KURA_S3_ENDPOINT: ${KURA_S3_ENDPOINT}
        KURA_FILE_TTL_DAYS: ${KURA_FILE_TTL_DAYS:-}
        KURA_QUOTA_DEFAULT_MB: ${KURA_QUOTA_DEFAULT_MB:-}
        KURA_UI_ORIGIN: ${KURA_UI_ORIGIN}
        KURA_NOINDEX: ${KURA_NOINDEX:-}
    restart: unless-stopped
    command: ["node", "scripts/serve-spa.ts"]
    environment:
      # 外向きの Host 名。空でも localhost / IP 直打ちは通る
      KURA_ALLOWED_HOSTS: ${KURA_ALLOWED_HOSTS:-}
    ports:
      - "${KURA_BIND_ADDR:-127.0.0.1}:${KURA_HTTP_PORT}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 2s
      retries: 30

  # 日次の運用タスク: file TTL 削除・放置 multipart 掃除。
  ops:
    build: *runtime-build
    restart: unless-stopped
    command: ["node", "scripts/ops-loop.ts"]
    environment:
      # compose 内部から S3 へ直接届く endpoint（env ファイルの値はホスト向け）
      KURA_S3_ENDPOINT: http://seaweedfs:8333
      KURA_ROOT_ACCESS_KEY: ${KURA_ROOT_ACCESS_KEY}
      KURA_ROOT_SECRET_KEY: ${KURA_ROOT_SECRET_KEY}
      # 空の意味が 2 つで逆なので注意: TTL は空 = 無効、multipart の猶予は
      # 空 = スクリプト側の既定 (7 日)。掃除を止める設定は無い。
      KURA_FILE_TTL_DAYS: ${KURA_FILE_TTL_DAYS:-}
      KURA_MULTIPART_MAX_AGE_DAYS: ${KURA_MULTIPART_MAX_AGE_DAYS:-}
      KURA_OPS_INTERVAL_SECONDS: ${KURA_OPS_INTERVAL_SECONDS:-86400}
    depends_on:
      seaweedfs:
        condition: service_healthy
