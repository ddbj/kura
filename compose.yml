name: kura

services:
  seaweedfs:
    image: docker.io/chrislusf/seaweedfs:4.37
    restart: unless-stopped
    entrypoint: ["/bin/sh", "/kura/entrypoint.sh"]
    command:
      - server
      - -dir=/data
      - -master.port=9333
      # per-user bucket = per-collection volumes: the default -volume.max=8
      # runs out of volume slots as buckets accumulate, so let it auto-scale
      # with free disk instead
      - -volume.max=0
      # SeaweedFS 4.37 rejects master.volumeSizeLimitMB >= 30000 at startup,
      # so KURA_VOLUME_SIZE_LIMIT_MB must be < 30000 (docs/operations.md).
      - -master.volumeSizeLimitMB=${KURA_VOLUME_SIZE_LIMIT_MB}
      - -volume.port=8082
      - -filer
      - -filer.port=8888
      - -s3
      - -s3.port=8333
      - -s3.config=/etc/seaweedfs/s3.json
      - -s3.iam.config=/etc/seaweedfs/iam.json
      - -s3.allowedOrigins=${KURA_S3_ALLOWED_ORIGINS}
      - -ip.bind=0.0.0.0
    environment:
      KURA_OIDC_ISSUER: ${KURA_OIDC_ISSUER}
      KURA_OIDC_CLIENT_ID: ${KURA_OIDC_CLIENT_ID}
      KURA_OIDC_JWKS_URI: ${KURA_OIDC_JWKS_URI}
      KURA_STS_SIGNING_KEY: ${KURA_STS_SIGNING_KEY}
      KURA_ROOT_ACCESS_KEY: ${KURA_ROOT_ACCESS_KEY}
      KURA_ROOT_SECRET_KEY: ${KURA_ROOT_SECRET_KEY}
      KURA_FILER_JWT_KEY: ${KURA_FILER_JWT_KEY}
      KURA_ADMIN_SUBS: ${KURA_ADMIN_SUBS:-}
      # default-quota reconciler (entrypoint.sh, docs/operations.md)
      KURA_QUOTA_DEFAULT_MB: ${KURA_QUOTA_DEFAULT_MB:-1048576}
      KURA_OPS_INTERVAL_SECONDS: ${KURA_OPS_INTERVAL_SECONDS:-86400}
    volumes:
      - ./seaweedfs/entrypoint.sh:/kura/entrypoint.sh:ro
      # /data は bind mount で渡す。named / anonymous volume にすると podman が
      # image 内の初期 dir を volume に copy-up する際に chown 1000:1000 を
      # 発火し、rootless podman + Lustre では chown 拒否で container が
      # 起動できない (docs/operations.md)。filer の LevelDB も -dir 配下の
      # /data/filerldb2 に作られるため、この 1 本で永続データを覆える。
      - ${KURA_SEAWEEDFS_DATA_DIR:-./data/seaweedfs}:/data
    ports:
      # S3 API のみ公開する。filer (8888) / master (9333) は内部 network に閉じる。
      # bind 先は default で loopback。前段の gateway が別ホストから来る配備先
      # だけ KURA_BIND_ADDR で開ける (docs/operations.md)。
      - "${KURA_BIND_ADDR:-127.0.0.1}:${KURA_S3_PORT}:8333"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/healthz"]
      interval: 2s
      timeout: 2s
      retries: 60

  # reference SPA の静的配信 (docs/architecture.md「SPA の配信」)。ビルド済みの
  # build/client を vite の preview server が配る。kura の機能には関与しないので
  # SeaweedFS には一切触らない。
  web:
    image: docker.io/library/node:24-alpine
    restart: unless-stopped
    working_dir: /kura
    command: ["node", "/kura/scripts/serve-spa.ts"]
    environment:
      # gateway が転送する Host。空でも localhost / IP 直は通る
      KURA_ALLOWED_HOSTS: ${KURA_ALLOWED_HOSTS:-}
    volumes:
      # 再ビルドは build/ をディレクトリごと作り直す。起動中の container は
      # 消えた inode を掴んだままになるので、再ビルド後は必ず web を再作成
      # する (docs/operations.md)。
      - ./build:/kura/build:ro
      - ./scripts:/kura/scripts:ro
      - ./node_modules:/kura/node_modules:ro
    ports:
      - "${KURA_BIND_ADDR:-127.0.0.1}:${KURA_HTTP_PORT}:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 2s
      timeout: 2s
      retries: 30

  # 日次の運用タスク: file TTL 削除・放置 multipart 掃除 (docs/operations.md)。
  # node は TS を直接実行できる
  ops:
    image: docker.io/library/node:24-alpine
    restart: unless-stopped
    command: ["node", "/kura/scripts/ops-loop.ts"]
    environment:
      # compose 内部から S3 へ直接届く endpoint（env ファイルの値はホスト向け）
      KURA_S3_ENDPOINT: http://seaweedfs:8333
      KURA_ROOT_ACCESS_KEY: ${KURA_ROOT_ACCESS_KEY}
      KURA_ROOT_SECRET_KEY: ${KURA_ROOT_SECRET_KEY}
      KURA_FILE_TTL_DAYS: ${KURA_FILE_TTL_DAYS:-}
      KURA_MULTIPART_MAX_AGE_DAYS: ${KURA_MULTIPART_MAX_AGE_DAYS:-}
      KURA_OPS_INTERVAL_SECONDS: ${KURA_OPS_INTERVAL_SECONDS:-86400}
    volumes:
      - ./scripts:/kura/scripts:ro
      - ./node_modules:/kura/node_modules:ro
    depends_on:
      seaweedfs:
        condition: service_healthy
